name: R7.4.5 Vienot reference iteration
on:
  push:
    branches: [research/163-cvd-transformations]
    paths:
      - experiments/r7_4_5_cvd_performance/**
      - experiments/r7_2_brettel_vienot_reference/**
      - experiments/r7_3_machado_2009_reference/**
      - .github/workflows/r7-4-5-bv-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [dmd-2.111.0, ldc-1.41.0, dmd-2.113.0, ldc-1.43.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
      - name: Qualify combined source in Debug and Release
        working-directory: experiments/r7_4_5_cvd_performance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bv-qualification"
          python3 prepare.py
          case "$DC" in
            *ldc2*) optimize=(-O3 -fp-contract=off) ;;
            *) optimize=(-O -inline) ;;
          esac
          "$DC" -g -boundscheck=on -of="$RUNNER_TEMP/bv-debug" bv_qualification.d candidates.d bv_policy.d _generated/bv.d
          "$RUNNER_TEMP/bv-debug" | tee "$RUNNER_TEMP/bv-qualification/debug.txt"
          "$DC" "${optimize[@]}" -release -boundscheck=on -of="$RUNNER_TEMP/bv-release" bv_qualification.d candidates.d bv_policy.d _generated/bv.d
          "$RUNNER_TEMP/bv-release" | tee "$RUNNER_TEMP/bv-qualification/release.txt"
      - name: Three-size balanced candidate comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/r7_4_5_cvd_performance/replay.py --compilers "$DC" --variants default bv_compiler bv_vienot_index bv_vienot_ref --sizes 1024 8191 65536 --blocks 3 --output "$RUNNER_TEMP/bv-replay" --notes "Integrated BV policy; shared CI clocks/thermals/SMT uncontrolled"
          python3 - "$RUNNER_TEMP/bv-replay" <<'PY'
          import csv,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          assert json.loads((root/'metadata.json').read_text())['status']=='passed'
          rows=list(csv.DictReader((root/'pooled-summary.csv').open()))
          assert len(rows)==4*3*28
          assert all(int(r['samples_per_language'])==54 for r in rows)
          print('Viénot reference iteration 336 cases, 54 samples per language/case: PASS')
          PY
      - name: Inspect fixed Vienot batch code generation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/inspect_vienot_codegen.py --output "$RUNNER_TEMP/bv-qualification/codegen" "$RUNNER_TEMP/bv-replay"/compiler-*/benchmark-bv_compiler "$RUNNER_TEMP/bv-replay"/compiler-*/benchmark-bv_vienot_index "$RUNNER_TEMP/bv-replay"/compiler-*/benchmark-bv_vienot_ref "$RUNNER_TEMP/bv-replay/cpp-benchmark"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bv-qualification-${{ matrix.compiler }}
          path: |
            ${{ runner.temp }}/bv-qualification/**
            ${{ runner.temp }}/bv-replay.tar.gz
